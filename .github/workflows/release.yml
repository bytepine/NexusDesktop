name: Release

on:
  push:
    tags:
      - "nexus-desktop-v*"

permissions:
  contents: write

jobs:
  meta:
    name: Parse version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#nexus-desktop-v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "Invalid tag: $TAG" >&2
            exit 1
          fi
          FILE_VERSION="$(tr -d '\r\n' < VERSION)"
          if [ "$FILE_VERSION" != "$VERSION" ]; then
            echo "VERSION ($FILE_VERSION) != tag ($VERSION)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -qE '\-beta(\.|$)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Build Windows
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # w64devkit v1.x 提供 GCC 14（标准 COFF，Go CGO 兼容）
      # GCC 16+ (binutils 2.46+) 默认 BigOBJ 格式，与 Go CGO 不兼容
      - name: Install w64devkit (GCC 14)
        run: |
          $url = "https://github.com/skeeto/w64devkit/releases/download/v1.23.0/w64devkit-1.23.0.zip"
          Invoke-WebRequest -Uri $url -OutFile "w64devkit.zip" -UseBasicParsing
          $item = Get-Item "w64devkit.zip"
          if ($item.Length -ne 76798128) { throw "w64devkit-1.23.0.zip size $($item.Length) != 76798128" }
          Expand-Archive "w64devkit.zip" -DestinationPath "C:\w64devkit"
          echo "C:\w64devkit\w64devkit\bin" >> $env:GITHUB_PATH

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      - name: Install goversioninfo (icon + FileVersion)
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.5.0

      - name: Install Inno Setup 7
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile "innosetup7.exe" -UseBasicParsing
          $hash = (Get-FileHash "innosetup7.exe" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f") { throw "Inno Setup checksum mismatch: $hash" }
          Start-Process -FilePath ".\innosetup7.exe" -ArgumentList "/VERYSILENT","/NORESTART","/SP-","/SUPPRESSMSGBOXES" -Wait
          echo "C:\Program Files\Inno Setup 7" >> $env:GITHUB_PATH

      - name: Build Windows exe
        run: |
          python scripts/build_desktop.py --version "${{ needs.meta.outputs.version }}" --output release --build-type release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-setup
          path: |
            release/NexusDesktop-windows-amd64-v*-setup.exe
            release/NexusDesktop-windows-amd64-v*-update.zip

  build-macos:
    name: Build macOS
    needs: meta
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      - name: Build macOS Universal DMG
        run: |
          python3 scripts/build_desktop.py --version "${{ needs.meta.outputs.version }}" --output release --build-type release --arch universal

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            release/NexusDesktop-darwin-universal.dmg
            release/NexusDesktop-darwin-universal-v*-update.zip

  release:
    name: Create GitHub Release
    needs: [meta, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes
        run: |
          python3 scripts/extract_release_notes.py \
            --version "${{ needs.meta.outputs.version }}" \
            --output release_notes.md \
            --verify

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: sha256sum NexusDesktop-* > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: NexusDesktop v${{ needs.meta.outputs.version }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          body_path: release_notes.md
          files: |
            NexusDesktop-windows-amd64-v*-setup.exe
            NexusDesktop-windows-amd64-v*-update.zip
            NexusDesktop-darwin-universal.dmg
            NexusDesktop-darwin-universal-v*-update.zip
            SHA256SUMS
