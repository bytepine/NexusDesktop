name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    name: nexus-desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"

      # Fyne 2.8 默认编译 X11 和 Wayland，原生检查需两套开发库
      - name: Install GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
